name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: unit + simulator
        run: >
          gradle :core-mesh:test :transport-api:test
          :service-chat:test :service-files:test :service-web:test
          :service-loc:test :agent:test :sim:run
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK packages (runner već ima SDK; setup-android@v3 je pokvaren — traži nepostojeći paket tools)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: APK compile (bez uređaja)
        run: gradle :transport-ble:assembleDebug :network-api:assembleDebug :app-demo:assembleDebug
