name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: unit + simulator
        run: >
          gradle :core-mesh:test :transport-api:test
          :service-chat:test :service-files:test :service-web:test
          :service-loc:test :agent:test :sim:run
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: APK compile (bez uređaja)
        uses: android-actions/setup-android@v3
      - run: gradle :transport-ble:assembleDebug :network-api:assembleDebug :app-demo:assembleDebug
